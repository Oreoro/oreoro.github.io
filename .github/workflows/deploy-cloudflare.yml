name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  # The Notion CMS worker triggers this when content is published.
  repository_dispatch:
    types: [notion-content-updated, content-publish]
  # Nightly refresh so scheduled/published Notion content stays current.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this rebuild was triggered"
        required: false
        default: "manual"

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  WRANGLER_VERSION: "4"

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Notion content caches make rebuilds fast. Keyed per run so a build can
      # always read the previous cache; content changes are detected by the
      # build's own timestamps.
      - name: Restore build caches
        uses: actions/cache@v4
        with:
          path: |
            tmp
            public/notion
            src/assets/notion
          key: focuslab-cms-${{ github.run_id }}
          restore-keys: |
            focuslab-cms-

      - name: Build site
        env:
          NOTION_API_SECRET: ${{ secrets.NOTION_API_SECRET }}
          DATA_SOURCE_ID: ${{ secrets.DATA_SOURCE_ID }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
          CONTEXT_DEV_API_KEY: ${{ secrets.CONTEXT_DEV_API_KEY }}
        run: npx --no-install astro build

      - name: Build search index
        run: npx --no-install pagefind --site dist

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy